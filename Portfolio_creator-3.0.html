<meta charset="utf-8"/>

<title>Portfolio — Add/Delete + Edit (Fixed)</title>
<style>
  html,body{
    margin:0;height:100%;background:#111;color:#eee;
    display:flex;justify-content:center;align-items:center;
    font:14px system-ui,Segoe UI,Roboto,sans-serif;
  }
  .canvas{position:relative;width:min(95vw,1600px);height:min(95vh, calc(95vw / 1.414));aspect-ratio:1.414/1;overflow:hidden;background:#111}
  .page{position:relative;width:100%;height:100%}
  .item{position:absolute;overflow:hidden;cursor:pointer}
  .item img{width:100%;height:100%;object-fit:cover;display:block;background:#222}
  .item:hover{outline:1px dashed rgba(255,255,255,.25)}
  .tooltip{position:absolute;left:0;bottom:100%;background:#000c;color:#fff;padding:8px;border-radius:6px;backdrop-filter:blur(2px);transform:translateY(-6px);min-width:220px;max-width:320px;pointer-events:none;opacity:0;transition:opacity .12s;font-size:13px;line-height:1.25}
  .item:hover .tooltip{opacity:1}
  .title{font-weight:600;margin-bottom:4px}
  .dim{opacity:.7}

  .controls{position:fixed;top:12px;right:12px;z-index:26;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls button, .controls input[type="text"], .controls input[type="number"]{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:6px 10px}
  .controls input[type=file]{display:none}
  .badge{padding:4px 8px;background:#222;border:1px solid #444;border-radius:6px}
  .selected{outline:2px solid #66f}

  .edit .item{outline:1px dashed #66f}
  .handle{position:absolute;width:14px;height:14px;right:-7px;bottom:-7px;background:#fff;border-radius:50%;border:2px solid #111;display:none;cursor:nwse-resize}
  .edit .handle{display:block}
</style>
</head>

  <div class="controls">
    <button id="btnToggle">Edit (E)</button><span id="mode" class="badge">View</span>

    <button id="btnDelete" disabled>Delete</button>

    <input id="inpDate" type="text" placeholder="Date">
    <input id="inpDesc" type="text" placeholder="Description">
    <input id="inpLink" type="text" placeholder="https://...">
    <input id="inpMobileOrder" type="number" min="1" max="99" placeholder="Mobile #">
    <label style="color:#eee;font-size:12px"><input id="inpHero" type="checkbox"> Hero</label>
    <button id="btnApply">Apply</button>
    <button id="btnExport">Export</button>
  </div>

const mode = document.getElementById('mode');

const fileAdd = document.getElementById('fileAdd');
const btnAttach = document.getElementById('btnAttach');
const fileAttach = document.getElementById('fileAttach');
const btnDelete = document.getElementById('btnDelete');
const selId = document.getElementById('selId');
const inpZ = document.getElementById('inpZ');
const inpTitle = document.getElementById('inpTitle');
const inpClient = document.getElementById('inpClient');

const inpDesc = document.getElementById('inpDesc');

const btnApply = document.getElementById('btnApply');
const inpMobileOrder = document.getElementById('inpMobileOrder');

let selectedId = null;
let editMode = false;

function pct(v){return v+'%'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function setEdit(on){ editMode=on; document.body.classList.toggle('edit', on); mode.textContent = on?'Edit':'View'; }
btnToggle.onclick = ()=> setEdit(!editMode);
document.addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='e') setEdit(!editMode); });

function render(){ page.innerHTML=''; items.forEach(place); }
function place(it){
  const el=document.createElement('div'); el.className='item'; el.id=it.id;
  const w=clamp(it.w,0,100), h=clamp(it.h,0,100), l=clamp(it.x,0,100-w), t=clamp(it.y,0,100-h);
  el.style.left=pct(l); el.style.top=pct(t); el.style.width=pct(w); el.style.height=pct(h); el.style.zIndex=clamp(it.z||1,1,25);
  const img=new Image(); img.src=it.src||''; img.alt=it.title||''; el.appendChild(img);
  const tip=document.createElement('div'); tip.className='tooltip';
  tip.innerHTML= '<div class="title">'+(it.title||'')+'</div>'+
                  '<div class="dim">Client:</div><div>'+(it.client||'—')+'</div>'+
                  '<div class="dim">Date:</div><div>'+(it.date||'—')+'</div>'+
                  '<div class="dim">Description:</div><div>'+(it.description||'—')+'</div>';
  el.appendChild(tip);

  el.addEventListener('mousedown', ev=>{ 
    if(!editMode) return;
    ev.preventDefault(); ev.stopPropagation();
    select(it.id);
    if(ev.target.classList.contains('handle')) return;
    startMove(el,it,ev);
  });

  el.addEventListener('click', ev=>{ if(editMode) { ev.stopPropagation(); return; } if(it.link) window.open(it.link,'_blank'); });

  const handle = document.createElement('div'); handle.className='handle';
  handle.addEventListener('mousedown', ev=>{ if(!editMode) return; ev.preventDefault(); ev.stopPropagation(); select(it.id); startResize(el,it,ev); });
  el.appendChild(handle);

  page.appendChild(el);
}

function clearSelection(){
  selectedId=null; selId.textContent='—'; btnDelete.disabled=true; btnAttach.disabled=true;
  document.querySelectorAll('.item').forEach(n=>n.classList.remove('selected'));
}

function select(id){
  selectedId=id; selId.textContent=id; btnDelete.disabled=false; btnAttach.disabled=false;
  const it = items.find(x=>x.id===id);
  inpZ.value = clamp(it.z||1,1,25);
  inpTitle.value = it.title||'';
  inpClient.value = it.client||'';
  inpDate.value = it.date||'';
  inpDesc.value = it.description||'';
  inpLink.value = it.link||'';
  inpMobileOrder.value = it.mobileOrder||'';
  inpHero.checked = !!it.hero;
  document.querySelectorAll('.item').forEach(n=>n.classList.remove('selected'));
  const el=document.getElementById(id); if(el) el.classList.add('selected');
}

document.addEventListener('click', e=>{
  if(e.target.closest('.controls')) return;
  if(e.target.closest('.item')) return;
  clearSelection();
});

btnApply.onclick = ()=>{ if(!selectedId) return; const it=items.find(x=>x.id===selectedId); if(!it) return;
  it.z = clamp(parseInt(inpZ.value)||1,1,25);
  it.title = inpTitle.value||''; it.client=inpClient.value||''; it.date=inpDate.value||'';
  it.description=inpDesc.value||''; it.link=inpLink.value||''; it.mobileOrder=parseInt(inpMobileOrder.value)||0; if(inpHero.checked){items.forEach(i=>i.hero=false);} it.hero=inpHero.checked; render(); saveState(); select(it.id);
};

btnAdd.onclick = ()=> fileAdd.click();
fileAdd.onchange = async (e)=>{
  const files = Array.from(e.target.files||[]);
  if(items.length + files.length > MAX_ITEMS){ alert('Max 25'); return; }
  for(const f of files){
    const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
    const id='item'+Math.random().toString(36).slice(2,8);
    items.push({id,title:f.name,client:'',date:'',description:'',link:'',src:dataUrl,x:10,y:10,w:20,h:20,z:1});
  }
  render(); saveState(); fileAdd.value='';
};

btnAttach.onclick = ()=> fileAttach.click();
fileAttach.onchange = async (e)=>{ if(!selectedId) return; const f=e.target.files?.[0]; if(!f) return;
  const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
  const it = items.find(x=>x.id===selectedId); if(it) it.src=dataUrl; render(); select(it.id); saveState(); fileAttach.value='';
};

btnDelete.onclick = ()=>{ if(!selectedId) return; items = items.filter(it=>it.id!==selectedId); clearSelection(); render(); saveState(); };

function startMove(el,it,down){
  const rect = page.getBoundingClientRect();
  const s={x:down.clientX,y:down.clientY,l:el.offsetLeft,t:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight};
  function onMove(e){ const dx=e.clientX-s.x, dy=e.clientY-s.y; const nl=clamp(s.l+dx,0,rect.width-s.w); const nt=clamp(s.t+dy,0,rect.height-s.h); el.style.left=nl+'px'; el.style.top=nt+'px'; }
  function onUp(){ const r=page.getBoundingClientRect(); it.x=(el.offsetLeft/r.width)*100; it.y=(el.offsetTop/r.height)*100; window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); saveState(); }
  window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
}
function startResize(el,it,down){
  const rect = page.getBoundingClientRect();
  const s={x:down.clientX,y:down.clientY,w:el.offsetWidth,h:el.offsetHeight,l:el.offsetLeft,t:el.offsetTop};
  function onMove(e){ const dx=e.clientX-s.x, dy=e.clientY-s.y; const nw=clamp(s.w+dx,30,rect.width-s.l); const nh=clamp(s.h+dy,30,rect.height-s.t); el.style.width=nw+'px'; el.style.height=nh+'px'; }
  function onUp(){ const r=page.getBoundingClientRect(); it.w=(el.offsetWidth/r.width)*100; it.h=(el.offsetHeight/r.height)*100; window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); saveState(); }
  window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
}
